<nav class="navbar">
  <div class="nav-container">
    <a routerLink="/dashboard" class="nav-brand" (click)="closeMenus()">
      <span class="brand-emoji">🍽️</span>
      <span class="brand-text">MealMeter</span>
    </a>

    <div class="nav-links" [class.open]="menuOpen">
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" (click)="closeMenus()">
        <span>📊</span> Dashboard
      </a>
      <a routerLink="/meals" routerLinkActive="active" (click)="closeMenus()">
        <span>🍴</span> All Meals
      </a>
      <a routerLink="/add-meal" routerLinkActive="active" (click)="closeMenus()">
        <span>➕</span> Add Meal
      </a>
    </div>

    <div class="nav-actions">
      <button class="btn-theme" (click)="toggleTheme()" [title]="themeService.isDark ? 'Light Mode' : 'Dark Mode'">
        {{ themeService.isDark ? '☀️' : '🌙' }}
      </button>

      <div class="user-menu-wrapper">
        <button class="user-avatar" (click)="toggleUserMenu()">
          <span class="avatar-letter">{{ userInitial }}</span>
          <span class="avatar-chevron">{{ userMenuOpen ? '▲' : '▼' }}</span>
        </button>
        <div class="user-dropdown" *ngIf="userMenuOpen">
          <div class="dropdown-header">
            <div class="dropdown-avatar">{{ userInitial }}</div>
            <div>
              <strong>{{ auth.currentUser?.name }}</strong>
              <small>{{ auth.currentUser?.email }}</small>
              <span class="role-badge" [class.admin]="auth.isAdmin">
                {{ auth.isAdmin ? '👑 Admin' : '👤 User' }}
              </span>
            </div>
          </div>
          <hr />
          <button class="dropdown-item danger" (click)="logout()">
            <span>🚪</span> Sign Out
          </button>
        </div>
      </div>

      <button class="hamburger" (click)="toggleMenu()" [class.open]="menuOpen">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</nav>

<div class="nav-overlay" *ngIf="menuOpen" (click)="closeMenus()"></div>
